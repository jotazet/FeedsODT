[project]
name = "feedsodt"
version = "1.0.0"
description = "Mirror najnowszych GTFS pod stałymi adresami"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "APScheduler>=3.10,<4",
    # GTFS-RT kolei (feedsodt/realtime): odczyt i zapis plików .pb.
    "gtfs-realtime-bindings>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
include = ["feedsodt*"]

# Wersjonowana kopia listy peronów PLK — bez niej przebudowa SKA nie ma
# ścieżki zapasowej, gdy GitHub Pages nie odpowiada.
[tool.setuptools.package-data]
feedsodt = ["data/*.json", "realtime/LICENSE.PolishTrainsGTFS"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testy nie ruszają sieci ani silników routujących: budują sztuczne paczki GTFS
# w tmp_path, a router podmieniają atrapą. Pełny przebieg po wszystkich źródłach
# to `python -m feedsodt run-once`.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Domyślny zestaw reguł ruffa sprzed 0.17, wpisany wprost: nowa wersja ruffa nie może
# sama poszerzać lintowania (0.17 dodała ok. 40 uwag w niezmienionym kodzie).
# Szerszy zestaw to osobna, świadoma zmiana.
select = ["E4", "E7", "E9", "F"]
