server {
    listen 80;
    server_name _;

    root /srv;
    charset utf-8;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = / {
        return 302 /gtfs/;
    }

    location /gtfs/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Feed zmienia się raz dziennie, ale kiedy — nie wiadomo z góry.
        # no-cache nie znaczy "nie cachuj", tylko "przed użyciem zapytaj".
        # nginx sam dokłada ETag i Last-Modified, więc konsument dostanie 304
        # i nie pobierze 59 MB bez potrzeby.
        add_header Cache-Control "no-cache" always;

        # Klienci GTFS bywają zewnętrzni — bez tego nagłówka odpada użycie z przeglądarki.
        add_header Access-Control-Allow-Origin "*" always;

        types {
            application/zip zip;
            application/json json;
        }
        default_type application/octet-stream;
    }

    # Katalog roboczy fetchera (.work) i pliki tymczasowe podmiany
    # nie mają prawa wyciec na zewnątrz.
    location ~ /\. {
        deny all;
        return 404;
    }
}
