# --- Jasło (MKS) --------------------------------------------------------------
# Nazwa pliku: GTFS_<id>_<YYYYMMDDHHMMSS>.zip. Dziś na stronie jest jeden plik,
# ale data w nazwie pozwala użyć today_forward, więc gdyby zaczęli zostawiać
# archiwum, wybór nadal będzie poprawny.
# Uwaga: feed_info.txt nie zawiera dat obowiązywania — okno wychodzi z calendar.txt.
[[source]]
name         = "jaslo"
run_day     = 1
run_at      = "02:00"
output       = "jaslo-gtfs.zip"
resolver     = "html"
url          = "https://www.mksjaslo.com.pl/strefa-pasazera/gtfs"
link_pattern = "/media/GTFS/.*\\.zip$"
hint_date    = "(\\d{4})(\\d{2})(\\d{2})\\d{6}"
hint_order   = "ymd"
select       = "today_forward"

# --- Słupsk (ZIM) -------------------------------------------------------------
# Pliki nazwane datą publikacji: /files/image/transport/2026-07-29.zip.
# NIEZWERYFIKOWANE: serwer był nieosiągalny podczas konfiguracji (port 443
# nie odpowiadał), więc wzorzec pochodzi z adresu podanego przez użytkownika,
# a nie z odczytanej strony. Sprawdź w logach pierwszego przebiegu.
[[source]]
name         = "slupsk"
run_day     = 1
run_at      = "03:00"
output       = "slupsk-gtfs.zip"
resolver     = "html"
url          = "https://zimslupsk.pl/otwarte-dane.html"
link_pattern = "/files/image/transport/.*\\.zip$"
hint_date    = "(\\d{4})-(\\d{2})-(\\d{2})"
hint_order   = "ymd"
select       = "today_forward"

# --- POLREGIO (cała Polska) ---------------------------------------------------
# Jeden stały adres, ale plik pod nim się zmienia.
#
# Feed źródłowy jest poprawny składniowo i bezużyteczny w praktyce:
# route_long_name, route_desc i trip_headsign puste w 100%, a „trasa" to numer
# pociągu — planer pokazuje 275 osobnych tras tam, gdzie pasażer widzi jedno
# połączenie Gdynia — Hel. Dlatego transform = "polregio": zwija 10620 tras do
# 26 kategorii (R, IR, BUS, K22...), dokłada kierunek i kierunkowskaz kursu,
# firmowe kolory, prawdziwe współrzędne peronów z listy PLK i hierarchię
# stacja -> perony.
#
# Po przebudowie feed idzie jeszcze przez krok `shape`: geometrię przejazdu
# liczą silniki routujące po OSM (profil "shape" w docker-compose), osobno dla
# kolei i dla komunikacji zastępczej. Dlatego POLREGIO ma własny slot — pierwszy
# przebieg to kilka minut routowania 4,5 tys. sekwencji przystanków i nie ma
# powodu, żeby dzieliło godzinę z czymkolwiek innym. Kolejne przebiegi idą
# głównie z cache'a geometrii.
#
# UWAGA: adres zawiera token udostępnienia. Gdy w logach pojawi się 404,
# trzeba wziąć nowy link ze strony przewoźnika.
[[source]]
name      = "polregio"
run_day     = 1
run_at      = "04:00"
output    = "polregio-gtfs.zip"
resolver  = "direct"
url       = "https://transfer.polregio.pl/public/file/2xpjhbomseoindotgttcsg/GTFS.zip"
filename  = "polregio-GTFS.zip"
transform  = "polregio"
shape      = "rail,bus"
shape_area = "poland"
select    = "single"

# --- ZKGKM Olkusz -------------------------------------------------------------
# 28 linii autobusowych, wszystkie z pustym route_color i bez shapes.txt.
# Feed składa kiedyPrzyjedzie.pl, więc feed_info wskazuje ich, nie nas —
# transform = "odt" przepisuje wystawcę i koloruje linie.
[[source]]
name        = "olkusz"
run_day     = 1
run_at      = "05:00"
output      = "olkusz-gtfs.zip"
resolver    = "direct"
url         = "https://api.odt.org.pl/feed/9/google_transit.zip"
filename    = "olkusz-GTFS.zip"
transform   = "odt"
route_color = "E6B800"
shape       = "bus"
shape_area  = "poland"
select      = "single"

# --- Małopolskie Linie Dowozowe (Koleje Małopolskie) --------------------------
# 70 linii autobusowych A1–A71 plus K63, K71 i SKA2. Barwy bierzemy z tabeli
# organizatora (config/colors/mld-routes.txt) — dopasowanie po route_short_name,
# bo route_id niesie numer publikacji i zmienia się co wydanie (1359_A1).
# shapes.txt jest w paczce, ale pusty: 0 wierszy, 0 kursów z shape_id.
[[source]]
name        = "mld"
run_day     = 2
run_at      = "01:00"
output      = "mld-gtfs.zip"
resolver    = "direct"
url         = "https://gtfs.kolejemalopolskie.com.pl/GTFS-ST/GTFS.zip"
filename    = "mld-GTFS.zip"
transform   = "odt"
colors_file = "mld-routes.txt"
shape       = "bus"
shape_area  = "poland"
select      = "single"

# --- SKA (Koleje Małopolskie) -------------------------------------------------
# UWAGA: ten feed nie zawiera dziś linii SKA1/SKA2/SKA3. Jego routes.txt to
# osiem nazw handlowych pociągów (KML, JASKÓŁKA, DUNAJEC, LUXTORPEDA...),
# route_short_name jest puste we wszystkich wierszach, a 1169 z 1224 kursów
# jedzie jako "KML". Dlatego wszystko dostaje domyślny #164194, a barwy SKA
# czekają gotowe w config/colors/ska.txt i wejdą same, gdy przewoźnik zacznie
# nazywać linie.
#
# W paczce jest shapes.txt, ale pusty — 0 wierszy, 0 kursów z shape_id — więc
# geometrię liczymy sami, po torach.
[[source]]
name        = "ska"
run_day     = 2
run_at      = "02:00"
output      = "ska-gtfs.zip"
resolver    = "direct"
url         = "https://www.kolejemalopolskie.com.pl/rozklady_jazdy/kml-ska-gtfs.zip"
filename    = "ska-GTFS.zip"
transform   = "ska,odt"
route_color = "164194"
colors_file = "ska.txt"
shape       = "rail"
shape_area  = "poland"
select      = "single"

