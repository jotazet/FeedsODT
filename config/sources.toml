# Konfiguracja źródeł GTFS.
#
# Każdy blok [[source]] to jeden plik wyjściowy w ./gtfs. Dodanie miasta zwykle
# nie wymaga pisania kodu — wystarczy skopiować najbliższy blok i podmienić adres.
#
# Wspólne pola:
#   name      — identyfikator w logach i w index.json
#   output    — nazwa pliku w ./gtfs (to jest ten "statyczny adres")
#   resolver  — html | ckan | nextcloud | direct
#   select    — single | today_forward
#   enabled   — opcjonalne, domyślnie true
#   transform — opcjonalna przebudowa feedu po pobraniu: "polregio" i "ska"
#               (naprawa modelu konkretnego przewoźnika) albo "odt" (kolory
#               linii + ODT jako wystawca). Kilka po przecinku = po kolei,
#               np. transform = "ska,odt"
#   route_color / colors_file — dla transform = "odt": jedna barwa dla
#               wszystkich linii albo tabela barw z config/colors/
#   shape     — opcjonalne dorobienie shapes.txt: "rail", "bus", "tram"
#               po przecinku; wymaga silników z profilu "shape"
#   shape_area — obszar pokryty wycinkiem OSM, np. "poland"; kurs wyjeżdżający
#               poza niego zostaje bez geometrii zamiast dostać zmyśloną
#   run_day / run_at — slot źródła w cyklu: dzień (0..FEEDSODT_INTERVAL_DAYS-1)
#               i godzina HH:MM. Każde źródło ma własny slot, więc na maszynie
#               nigdy nie liczą się dwa naraz. Bez tych pól źródło idzie
#               w dniu 0 o wspólnej godzinie FEEDSODT_RUN_AT.
#
# Polityki:
#   single         — źródło daje jeden plik, bierzemy go
#   today_forward  — źródło daje wiele paczek; składamy łańcuch od dzisiaj
#                    jak najdalej w przód
#
# Resolver "html" rozpoznaje odnośnik po jednym z dwóch wzorców:
#   link_pattern — regex na adresie (gdy w URL-u jest "gtfs")
#   link_text    — regex na podpisie odnośnika (gdy nazwa pliku nic nie mówi)
# Opcjonalnie hint_date wyłuskuje datę początku obowiązywania z tekstu wiersza
# lub adresu; przy wielu wersjach oszczędza pobierania, przy jednej jest zbędny.


# --- Wrocław -----------------------------------------------------------------
# Tabela z 69 wersjami, nieposortowana, o nakładających się okresach.
# hint_date (DDMMYYYY z nazwy) pozwala pobrać 3 pliki zamiast 69.
[[source]]
name         = "wroclaw"
run_day     = 0
run_at      = "01:00"
output       = "wroclaw-gtfs.zip"
resolver     = "html"
url          = "https://open-data.cui.wroclaw.pl/hdb/ft/6/"
link_pattern = "/hdb/download/\\d+/?$"
hint_date    = "(\\d{2})(\\d{2})(\\d{4})"
hint_order   = "dmy"
select       = "today_forward"

# --- GZM (Katowice i okolice), wersja rozszerzona -----------------------------
# Nie wersje jednego pliku, tylko 9 paczek o rozłącznych oknach dat,
# razem 14 dni. Łańcuch spina je w jeden feed.
[[source]]
name     = "gzm-extend"
run_day     = 0
run_at      = "02:00"
output   = "gzm-extend-gtfs.zip"
resolver = "ckan"
base_url = "https://otwartedane.metropoliagzm.pl"
dataset  = "rozklady-jazdy-i-lokalizacja-przystankow-gtfs-wersja-rozszerzona"
select   = "today_forward"

